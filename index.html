<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102d40">
<title>跨学科接接乐</title>
<style>
:root{color-scheme:dark;--bg:#0b2538;--panel:#173f50;--ink:#f4fff9;--soft:#cce3df;--mint:#82f3d6;--gold:#ffe096;--red:#ffaca4;--line:#a4e6da70;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100svh;color:var(--ink);background:radial-gradient(circle at 50% 7%,#397a7a,#173e52 48%,var(--bg) 100%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(#b7e8e0 1px,transparent 1px);background-size:30px 30px}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.46}[hidden]{display:none!important}
.app{position:relative;width:min(1500px,100%);margin:auto;padding:14px clamp(9px,2vw,28px) 30px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}.brand{display:flex;align-items:center;gap:10px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#bcfbe7;color:#164550;font-weight:950;box-shadow:0 5px 0 #6fbcae}.brand h1{font-size:clamp(18px,2vw,26px);line-height:1.1;margin:0}.brand small{font-size:12px;color:var(--soft)}.toolbar{display:flex;flex-wrap:wrap;justify-content:end;gap:7px}.small-btn{border:1px solid var(--line);background:#20495bdc;color:var(--ink);border-radius:11px;padding:9px 12px}.small-btn:hover:not(:disabled){background:#2e6270}.primary{border:0;border-radius:14px;padding:12px 18px;background:linear-gradient(115deg,var(--mint),var(--gold));color:#193b47;font-weight:900;box-shadow:0 5px 0 #288e80}.primary:hover:not(:disabled){filter:brightness(1.08)}
.panel{max-width:1050px;margin:clamp(10px,3vh,30px) auto;background:linear-gradient(150deg,#1d4a59f4,#123447f4);border:1px solid var(--line);border-radius:25px;box-shadow:0 24px 65px #071c2b91;padding:clamp(18px,3vw,35px)}.eyebrow{margin:0 0 8px;color:var(--mint);font-size:12px;letter-spacing:.14em;font-weight:900}.panel h2{font-size:clamp(27px,4vw,46px);margin:0 0 10px;line-height:1.2}.lead{color:#e0efea;line-height:1.7;margin:0 0 15px}.step{border-top:1px solid #a3e7da45;margin-top:18px;padding-top:2px}.step-title{font-size:18px;margin:17px 0 10px;color:var(--gold)}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{display:flex;align-items:center;gap:12px;min-height:86px;width:100%;padding:11px 14px;background:#285768c7;border:1px solid #9ddbd385;border-radius:17px;text-align:left;color:var(--ink);transition:transform .16s,background .16s}.choice:hover:not(:disabled){transform:translateY(-2px);background:#326877}.choice.selected{background:#246a61;border-color:#b8ffe5;box-shadow:inset 0 0 0 2px #c8ffdf55}.choice strong{display:block;font-size:16px}.choice small{display:block;font-size:12px;color:#d4e6dd;line-height:1.45;margin-top:4px}.icon{font-size:28px;width:40px;text-align:center;flex:none}.hint{font-size:13px;color:var(--soft);line-height:1.55;margin:8px 0}.tool-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tool-side{border:1px solid #a3e7da65;border-radius:16px;padding:11px;background:#13384a8e}.tool-side h4{margin:0 0 8px}.tool-side .choice{min-height:70px;margin:7px 0;padding:8px}.step-action{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}.note{font-size:12px;color:var(--soft);line-height:1.6;border-left:3px solid var(--mint);padding-left:11px;margin:18px 0 0}
.avatar{width:52px;height:52px;border-radius:17px;flex:none;display:grid;place-items:center;position:relative;background:linear-gradient(#a6ffe9,#40c9ba);box-shadow:inset 0 -7px 0 #208e90,0 5px 0 #103949;transform:rotate(-5deg)}.avatar.two{border-radius:50%;background:linear-gradient(#ffe3ab,#ffa084);box-shadow:inset 0 -7px 0 #d36c70,0 5px 0 #103949;transform:rotate(5deg)}.avatar:before{content:"••";position:absolute;top:11px;color:#153d50;font-size:19px;letter-spacing:7px}.avatar:after{content:"⌣";position:absolute;top:27px;color:#153d50;font-weight:bold;font-size:19px}.avatar.small{width:39px;height:39px;border-radius:12px;box-shadow:inset 0 -5px 0 #208e90}.avatar.small.two{border-radius:50%;box-shadow:inset 0 -5px 0 #d36c70}.avatar.small:before{top:7px;font-size:14px;letter-spacing:4px}.avatar.small:after{top:17px;font-size:14px}.avatar.jump{animation:jump .72s ease 2}
.game-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:11px;background:#163b4fd9;border:1px solid var(--line);border-radius:15px}.speed{display:flex;align-items:center;gap:8px;font-size:13px}.speed input{width:min(175px,22vw);accent-color:#92f4d8}.speed output{min-width:66px;color:var(--gold);font-weight:900}.stage{display:grid;grid-template-columns:minmax(220px,1fr) minmax(235px,.94fr) minmax(220px,1fr);gap:11px;align-items:stretch}.side,.lane{position:relative;overflow:hidden;border:1px solid var(--line);background:#183e50eb;border-radius:22px;box-shadow:0 14px 40px #06172455}.side{display:flex;flex-direction:column;min-width:0;padding:13px}.side.active{border:3px solid var(--gold);background:radial-gradient(circle at 50% 45%,#3c6763,#1a4351 76%)}.side.inactive{opacity:.82}.side-head{display:flex;align-items:center;justify-content:space-between;gap:6px}.side-id{display:flex;align-items:center;gap:7px;min-width:0}.side-id strong{display:block;font-size:15px}.side-id small{display:block;font-size:11px;color:var(--soft)}.score{color:var(--gold);font-size:27px;font-weight:950;white-space:nowrap;line-height:1.1;text-align:right}.score small{display:block;color:var(--soft);font-size:10px;font-weight:500}.round-pill{align-self:flex-start;font-size:12px;border:1px solid #9ccfc576;background:#21535a;padding:5px 9px;border-radius:99px;margin:9px 0 0}.prompt-card{display:grid;place-items:center;text-align:center;min-height:205px;flex:1;padding:12px}.prompt-visual{font-size:54px;filter:drop-shadow(0 5px 11px #0b243b88)}.prompt-tag{font-size:11px;color:var(--mint);letter-spacing:.08em;margin-top:6px}.prompt-title{font-size:clamp(17px,1.8vw,25px);font-weight:950;line-height:1.35;margin:6px 0;color:#fff2bd;overflow-wrap:anywhere}.prompt-text{font-size:12px;line-height:1.55;color:#e2f2ed}.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.side-actions button{padding:8px 6px;font-size:12px;min-height:40px}.side-actions .pick{grid-column:1/-1;font-size:14px;min-height:45px}.side-actions .pick.current{background:#ffe19a;color:#143f48;border:2px solid #fff5d5;box-shadow:0 0 0 2px #ffe19a55}.side-status{min-height:77px;line-height:1.45;font-size:12px;color:#e8f7ec;background:#234e58bb;border-radius:11px;padding:8px;margin:9px 0;display:flex;flex-direction:column;justify-content:center}.side-status.error{background:#6a4b4c;border:1px solid #ffb5a4}.side-status.success{background:#315c49;border:1px solid #ffe19a}.next{width:100%;min-height:49px;font-size:17px}.next.ready{animation:glow 1.7s ease-in-out infinite}.progress{display:flex;gap:5px;justify-content:center;margin:9px 0 2px}.pip{width:19px;height:5px;border-radius:99px;background:#8bbdc064}.pip.done{background:var(--mint)}.pip.current{background:var(--gold)}
.lane{height:590px;--travel:522px;--duration:14s;background:linear-gradient(#254e5fe8,#153a4fe3)}.lane:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 77px,#bce9dc14 78px 79px)}.lane-head{position:absolute;z-index:2;top:0;left:0;right:0;text-align:center;padding:12px 8px;background:#173e51f2;border-bottom:1px solid var(--line)}.lane-head strong{display:block;color:var(--gold);font-size:17px}.lane-head span{font-size:12px;color:#d9e9df;line-height:1.5}.lane-floor{position:absolute;bottom:0;left:0;right:0;height:30px;background:linear-gradient(transparent,#60d9c84a);border-bottom:3px solid #9cebd65c;pointer-events:none}.fall-card{position:absolute;left:16%;top:0;width:68%;min-height:46px;border:2px solid #a3e7dd;background:linear-gradient(115deg,#d9fff2,#9ee7da);color:#163c48;border-radius:12px;padding:5px 8px;font-size:clamp(13px,1.15vw,17px);font-weight:900;line-height:1.25;text-align:center;box-shadow:0 6px 0 #51858a,0 12px 24px #08243788;animation:fall var(--duration) linear infinite}.fall-card.alt{background:linear-gradient(115deg,#fff4ce,#ffdaa4);border-color:#ffe8ab}.fall-card:hover,.fall-card:focus-visible{animation-play-state:paused;filter:brightness(1.07);z-index:3}.stage.paused .fall-card{animation-play-state:paused}.fall-card:disabled{filter:grayscale(.8);opacity:.32;pointer-events:none}.lane-message{position:absolute;z-index:2;top:39%;left:7%;width:86%;background:#14384be9;border:1px solid var(--gold);border-radius:15px;padding:17px;text-align:center;color:#fff0c7;font-weight:800;line-height:1.5}.lane-message.celebrate{background:linear-gradient(130deg,#287565f2,#826633ed);border:2px solid #ffe6a6;box-shadow:0 0 25px #ffe5a57d;animation:score-pop .7s ease}.game-foot{margin:10px auto;text-align:center;color:var(--soft);font-size:12px;line-height:1.6}
.summary{text-align:center;max-width:900px}.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;text-align:left;margin:20px 0}.result-panel{background:#24515c;border:1px solid var(--line);padding:15px;border-radius:16px}.result-panel h3{margin:0 0 5px}.giant-score{font-size:50px;font-weight:950;color:var(--gold);line-height:1.1}.result-row{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #a4dcd259;padding:7px 0;font-size:12px}.result-row span:last-child{color:var(--mint);font-weight:900;white-space:nowrap}.summary-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:9px}.coins{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden}.coin{position:absolute;top:-45px;width:29px;height:29px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff5bd,#ffd152 62%,#e09b28);color:#946014;display:grid;place-items:center;font-weight:900;border:2px solid #fff0a2;box-shadow:0 3px 9px #0005;animation:coinfall 1.2s ease-in forwards;animation-delay:var(--coin-delay)}.modal{position:fixed;inset:0;z-index:30;background:#061b2ad6;display:grid;place-items:center;padding:16px}.modal-card{background:#1b4351;border:1px solid #aae5d294;border-radius:20px;box-shadow:0 25px 65px #0009;width:min(650px,100%);max-height:90svh;overflow:auto;padding:23px}.modal-card h2{margin:0 0 12px}.modal-card p,.modal-card li{color:#e0eee9;line-height:1.7}.modal-close{float:right}.zoom-card{display:grid;place-items:center;text-align:center;background:#255963;border-radius:14px;padding:20px;min-height:260px}
@keyframes fall{from{transform:translateY(-85px)}to{transform:translateY(var(--travel))}}@keyframes jump{0%,100%{transform:translateY(0)}48%{transform:translateY(-19px) rotate(-8deg)}}@keyframes score-pop{50%{transform:scale(1.22)}}@keyframes coinfall{to{transform:translateY(108vh) rotate(650deg);opacity:.4}}@keyframes glow{50%{box-shadow:0 0 16px #ffe99bcc,0 5px 0 #288e80}}
@media(max-width:1030px){.stage{grid-template-columns:1fr 1fr;grid-template-areas:"left right" "center center"}.side.left{grid-area:left}.side.right{grid-area:right}.lane{grid-area:center;height:380px;--travel:315px}.prompt-card{min-height:155px}.fall-card{left:16%;width:68%}}
@media(max-width:600px){.app{padding:10px 8px 20px}.logo{width:33px;height:33px}.brand h1{font-size:16px}.brand small{font-size:11px}.toolbar .small-btn{padding:7px 8px;font-size:11px}.panel{padding:19px 13px;border-radius:18px}.choice-grid,.tool-pair{gap:7px}.choice{min-height:82px;gap:7px;padding:8px;border-radius:12px}.choice strong{font-size:13px}.choice small{font-size:10px}.icon{width:30px;font-size:23px}.game-top{padding:8px;font-size:12px}.speed input{width:90px}.stage{gap:6px}.side{padding:7px;border-radius:15px}.side-id{gap:3px}.side-id strong{font-size:11px}.side-id small{font-size:9px}.side .avatar.small{width:27px;height:27px}.side .avatar.small:before{top:3px;font-size:10px;letter-spacing:2px}.side .avatar.small:after{top:10px;font-size:10px}.score{font-size:22px}.round-pill{font-size:10px;padding:3px 6px}.prompt-card{min-height:122px;padding:5px}.prompt-visual{font-size:35px}.prompt-tag,.prompt-text{font-size:9px}.prompt-title{font-size:12px}.side-actions{gap:4px}.side-actions button{font-size:9px;padding:5px 2px;min-height:35px}.side-actions .pick{font-size:10px;min-height:40px}.side-status{min-height:90px;font-size:9px;padding:6px;margin:7px 0}.next{font-size:12px;min-height:41px}.pip{width:10px}.lane{height:355px;--travel:295px;border-radius:15px}.lane-head{padding:7px}.lane-head strong{font-size:13px}.lane-head span{font-size:10px}.fall-card{left:11%;width:78%;min-height:43px;font-size:12px}.result-grid{gap:7px}.result-panel{padding:8px}.result-row{font-size:10px;display:block}.result-row span{display:block}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}.fall-card{animation:none!important;transform:translateY(var(--static-y))}.coin{display:none}}
@page{size:A4;margin:10mm}@media print{body{background:#fff;color:#111}.app{width:100%;padding:0}header,#setupScreen,#gameScreen,.modal,.summary-actions{display:none!important}.summary:not([hidden]){display:block!important;border:0;box-shadow:none;background:#fff;color:#111;max-width:none;margin:0;padding:0}.result-grid{margin:8px 0;gap:6px}.result-panel{padding:7px;background:#fff;color:#111;border-color:#aaa;break-inside:avoid}.giant-score{font-size:29px;color:#b22!important}.result-row{padding:3px 0;font-size:10px;border-color:#aaa}.summary .eyebrow{color:#b22}.summary .lead,.note{color:#222}}

/* 芳香烃题卡：环位 1—6 是读图标记，结构在普通与定位档均保持可核验。 */
.prompt-card,.zoom-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0}
.prompt-visual{width:100%;display:grid;place-items:center;font-size:inherit;filter:none}
.ring-svg{display:block;width:min(100%,315px);max-height:200px;overflow:visible}
.zoom-card .ring-svg{width:min(100%,450px);max-height:320px}
.ring-bond{stroke:#b7f5e4;stroke-width:4.2;stroke-linecap:round}.aromatic-circle{fill:none;stroke:#b7f5e4;stroke-width:3.2}
.sub-bond{stroke:#ffe09b;stroke-width:3.5;stroke-linecap:round}.sub-label{fill:#ffe09b;font:700 17px 'Microsoft YaHei',system-ui,sans-serif}
.ring-index{fill:#a8d9da;font:600 12px system-ui,sans-serif}
.prompt-title{font-size:clamp(13px,1.45vw,18px);margin:0}.prompt-text{font-size:11px}.prompt-tag{margin:0}
@media(max-width:600px){.prompt-card{padding:4px 2px;min-height:155px}.ring-svg{max-height:156px}.sub-label{font-size:19px}.ring-index{font-size:14px}.prompt-title{font-size:11px}.prompt-text{font-size:10px}.zoom-card .ring-svg{max-height:260px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div id="logo" class="logo" aria-hidden="true">★</div><div><h1 id="brandTitle">知识接接乐</h1><small id="brandVersion">V1.0</small></div></div>
  <div class="toolbar"><button id="helpBtn" class="small-btn" type="button">❔ 帮助·怎么玩</button><button id="soundBtn" class="small-btn" type="button" aria-pressed="true">🔊 声音开</button></div>
</header>
<main>
<section id="setupScreen" class="panel" aria-labelledby="heroTitle">
  <p id="eyebrow" class="eyebrow"></p><h2 id="heroTitle"></h2><p id="heroText" class="lead"></p>
  <div><h3 class="step-title">① 先选冒险方式</h3><div class="choice-grid" role="group" aria-label="选择单人或双人游戏">
    <button class="choice" type="button" data-play="solo" aria-pressed="false"><span class="icon" aria-hidden="true">🧭</span><span><strong>单人寻知冒险</strong><small>独自挑战，可选左侧或右侧</small></span></button>
    <button class="choice" type="button" data-play="duo" aria-pressed="false"><span class="icon" aria-hidden="true">🤝</span><span><strong>双人金币接力</strong><small>两侧轮流接题，各自计分</small></span></button>
  </div></div>
  <div id="roleStep" class="step" hidden><h3 class="step-title">② 选角色与位置</h3><p id="roleHint" class="hint"></p><div id="roleChoices" class="choice-grid" role="group" aria-label="选择角色所在侧"></div></div>
  <div id="toolStep" class="step" hidden><h3 class="step-title">③ 各选各的专属道具</h3><p class="hint">左侧道具只给左侧角色使用，右侧道具只给右侧角色使用。</p><div class="tool-pair"><div class="tool-side"><h4 id="leftToolTitle"></h4><div id="leftTools"></div></div><div class="tool-side"><h4 id="rightToolTitle"></h4><div id="rightTools"></div></div></div></div>
  <div id="modeStep" class="step" hidden><h3 class="step-title">④ 最后选练习档</h3><div id="modeChoices" class="choice-grid" role="group" aria-label="选择练习档"></div></div>
  <div class="step-action"><button id="startBtn" class="primary" type="button" disabled>开始接答案 →</button><span id="setupHint" class="hint" role="status">先选单人冒险或双人接力</span></div>
  <p class="note">每侧10轮，前3轮共60分，后7轮共40分。答错不扣分，本侧暂停一次；答对后“继续”立即点亮，也会自动续题。同难度组内题序随机。</p>
</section>
<section id="gameScreen" hidden aria-label="接接乐游戏">
  <div class="game-top"><span id="gameMode"></span><label class="speed" for="speedRange">下落速度 <input id="speedRange" type="range" min="1" max="3" step="1" value="2"><output id="speedLabel" for="speedRange">中 · 14秒</output></label><button id="pauseBtn" class="small-btn" type="button" aria-pressed="false">⏸ 暂停飘落</button></div>
  <div id="stage" class="stage">
    <article id="leftSide" class="side left" aria-label="左侧答题区">
      <div class="side-head"><div class="side-id"><span id="leftAvatar" class="avatar small" aria-hidden="true"></span><span><strong id="leftName"></strong><small id="leftPosition"></small></span></div><div class="score"><small>左侧得分</small><span id="leftScore">0</span></div></div>
      <span id="leftRound" class="round-pill"></span><div id="leftPrompt" class="prompt-card"></div>
      <div class="side-actions"><button id="leftPick" class="primary pick" type="button"></button><button id="leftHint" class="small-btn" type="button">道具线索</button><button id="leftZoom" class="small-btn" type="button">放大题卡</button></div>
      <div id="leftStatus" class="side-status" role="status" aria-live="polite"></div><button id="leftContinue" class="small-btn" type="button" hidden>继续尝试 →</button><button id="leftNext" class="primary next" type="button" disabled>继续 →</button><div id="leftProgress" class="progress"></div>
    </article>
    <section id="lane" class="lane" aria-label="中央下落的答案"><div class="lane-head"><strong id="targetPrompt"></strong><span id="laneSub"></span></div><div id="laneMessage" class="lane-message" hidden></div><div class="lane-floor"></div></section>
    <article id="rightSide" class="side right" aria-label="右侧答题区">
      <div class="side-head"><div class="side-id"><span id="rightAvatar" class="avatar small two" aria-hidden="true"></span><span><strong id="rightName"></strong><small id="rightPosition"></small></span></div><div class="score"><small>右侧得分</small><span id="rightScore">0</span></div></div>
      <span id="rightRound" class="round-pill"></span><div id="rightPrompt" class="prompt-card"></div>
      <div class="side-actions"><button id="rightPick" class="primary pick" type="button"></button><button id="rightHint" class="small-btn" type="button">道具线索</button><button id="rightZoom" class="small-btn" type="button">放大题卡</button></div>
      <div id="rightStatus" class="side-status" role="status" aria-live="polite"></div><button id="rightContinue" class="small-btn" type="button" hidden>继续尝试 →</button><button id="rightNext" class="primary next" type="button" disabled>继续 →</button><div id="rightProgress" class="progress"></div>
    </article>
  </div>
  <p class="game-foot">当前拿着哪侧道具，正确答案就给哪侧计分；答错只暂停该侧。</p>
</section>
<section id="summaryScreen" class="panel summary" hidden aria-labelledby="summaryTitle"><p class="eyebrow">冒险完成</p><h2 id="summaryTitle">答案都接住啦！</h2><p id="summaryLead" class="lead"></p><div id="resultGrid" class="result-grid"></div><div class="summary-actions"><button id="otherModeBtn" class="primary" type="button"></button><button id="restartBtn" class="small-btn" type="button">重新选冒险方式</button><button id="printBtn" class="small-btn" type="button">打印本局记录</button></div><p id="summaryNote" class="note"></p></section>
</main>
</div>

$('soundBtn').addEventListener('click',function(){muted=!muted;if(muted&&'speechSynthesis'in window)window.speechSynthesis.cancel();$('soundBtn').textContent=muted?'🔇 声音关':'🔊 声音开';$('soundBtn').setAttribute('aria-pressed',String(!muted));try{localStorage.setItem(KEY+'-sound',muted?'off':'on')}catch(e){}});$('pauseBtn').addEventListener('click',function(){if(this.disabled)return;manualPause=!manualPause;syncMotion()});$('speedRange').addEventListener('input',function(){if(state.phase!=='play')return;state.speed=Number(this.value);save();updateSpeed()});
['left','right'].forEach(function(side){$(side+'Pick').addEventListener('click',function(){if(state.phase!=='play'||!eligible(side)||done(side))return;state.active=side;manualPause=false;save();renderGame()});$(side+'Hint').addEventListener('click',function(){var v=state.sides[side];if(state.phase!=='play'||!eligible(side)||v.hintUsed||v.solved||v.halted||done(side))return;v.hintUsed=true;save();renderSide(side)});$(side+'Zoom').addEventListener('click',function(){if(state.phase!=='play')return;openModal(M.side_labels[side].name+' · 放大题卡',promptNode(sideQuestion(side),state.mode,true))});$(side+'Continue').addEventListener('click',function(){var v=state.sides[side];if(state.phase!=='play'||!eligible(side)||!v.halted)return;v.halted=false;state.active=side;manualPause=false;save();renderGame();var first=$('lane').querySelector('.fall-card:not(:disabled)');if(first)first.focus()});$(side+'Next').addEventListener('click',function(){next(side)})});
$('otherModeBtn').addEventListener('click',function(){if(state.phase!=='done')return;var other=M.modes.filter(function(x){return x.id!==state.mode})[0];start(state.type,state.players,state.props,other.id)});$('restartBtn').addEventListener('click',function(){['left','right'].forEach(clearAdvance);state=fresh();setup={type:null,players:[],props:{left:null,right:null},mode:null};manualPause=false;save();render()});$('printBtn').addEventListener('click',function(){if(state.phase==='done')window.print()});document.addEventListener('visibilitychange',function(){if(!document.hidden&&state.phase==='play')state.players.forEach(function(side){if(state.sides[side].solved)schedule(side)})});
initStatic();try{muted=localStorage.getItem(KEY+'-sound')==='off'}catch(e){}$('soundBtn').textContent=muted?'🔇 声音关':'🔊 声音开';$('soundBtn').setAttribute('aria-pressed',String(!muted));load();render();
})();
</script>
</body>
</html>
